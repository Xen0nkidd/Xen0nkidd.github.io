<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0f; color: #eee; font-family: system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
    #bar {
      flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
      padding: 8px 10px; background: #14141a; border-bottom: 1px solid #2a2a35;
    }
    #bar input {
      flex: 1; height: 36px; border-radius: 10px; border: 1px solid #333;
      background: #1c1c24; color: #eee; padding: 0 12px; outline: none;
    }
    #bar button {
      height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #333;
      background: #22222c; color: #eee; cursor: pointer;
    }
    #bar button.go { background: #ff294d; border-color: #ff294d; color: #fff; font-weight: 600; }
    #frame-parent { flex: 1; position: relative; min-height: 0; background: #000; }
    #frame-parent iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #status { padding: 12px 14px; font-size: 13px; opacity: 0.8; display: none; }
    #status.err { display: block; color: #ff8a9a; }
  </style>
  <script src="/js/education-proxy-paths.js"></script>
  <script src="/js/all.js"></script>
  <script src="/js/index.js"></script>
  <script src="/js/register-sw.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="bar">
      <button type="button" id="back" title="Back">←</button>
      <button type="button" id="fwd" title="Forward">→</button>
      <button type="button" id="reload" title="Reload">↻</button>
      <input id="addr" type="text" placeholder="Search or enter URL" spellcheck="false" />
      <button type="button" class="go" id="go">Go</button>
    </div>
    <div id="status"></div>
    <div id="frame-parent"></div>
  </div>
  <script>
(async function () {
  const status = document.getElementById("status");
  const addr = document.getElementById("addr");
  const parent = document.getElementById("frame-parent");
  let scramjet = null;
  let frame = null;

  function showErr(msg) {
    status.className = "err";
    status.textContent = msg;
  }

  function encodeUrl(url) {
    if (globalThis.velaraScramjetCodec && velaraScramjetCodec.encode) {
      return velaraScramjetCodec.encode(url);
    }
    const bytes = new TextEncoder().encode(url);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function normalize(q) {
    q = String(q || "").trim();
    if (!q) return "";
    if (/^https?:\/\//i.test(q)) return q;
    if (/^[a-z0-9.-]+\.[a-z]{2,}([/:].*)?$/i.test(q)) return "https://" + q;
    return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
  }

  async function init() {
    try {
      if (typeof waitForProxyServiceWorkerControl === "function") {
        const st = await waitForProxyServiceWorkerControl({
          reloadKey: "xenon-xbrowser-sw",
          maxWaitMs: 15000,
        });
        if (st === "reload") return;
      } else if (typeof registerSW === "function") {
        await registerSW();
        await navigator.serviceWorker.ready;
      }

      if (typeof $scramjetLoadController === "undefined") {
        throw new Error("Scramjet not loaded");
      }
      if (typeof BareMux === "undefined") {
        throw new Error("BareMux not loaded");
      }
      const P = globalThis.velaraEduProxy;
      if (!P) throw new Error("Missing velaraEduProxy");

      const { ScramjetController } = $scramjetLoadController();
      scramjet = new ScramjetController({
        prefix: P.lessonPrefix,
        files: {
          wasm: P.runtimeBase + "wasm.wasm",
          all: P.runtimeBase + "all.js",
          sync: P.runtimeBase + "sync.js",
        },
        ...(globalThis.velaraScramjetCodec ? { codec: globalThis.velaraScramjetCodec } : {}),
      });
      await scramjet.init();

      const connection = new BareMux.BareMuxConnection(P.messagingBase + "worker.js");
      const wispUrl =
        (location.protocol === "https:" ? "wss" : "ws") +
        "://" + location.host + P.wispPath;
      const transportScriptUrl = P.transportBase + "index.mjs?v=20260512d";
      await connection.setTransport(transportScriptUrl, [{ websocket: wispUrl }]);

      frame = scramjet.createFrame(parent);
      status.className = "";
      status.style.display = "none";

      // Auto-load from query ?to=
      const params = new URLSearchParams(location.search);
      const to = params.get("to");
      if (to) {
        addr.value = to;
        go(to);
      }

      // postMessage from Xenon parent
      window.addEventListener("message", (ev) => {
        const d = ev.data;
        if (!d || d.type !== "xenon-navigate") return;
        if (d.url) {
          addr.value = d.url;
          go(d.url);
        }
      });

      window.parent && window.parent.postMessage({ type: "xenon-browser-ready" }, "*");
    } catch (err) {
      console.error(err);
      showErr("Browser engine failed: " + (err && err.message ? err.message : err));
    }
  }

  function go(raw) {
    const url = normalize(raw || addr.value);
    if (!url || !frame) return;
    addr.value = url;
    try {
      frame.go(url);
    } catch (err) {
      showErr(String(err));
    }
  }

  document.getElementById("go").onclick = () => go();
  addr.addEventListener("keydown", (e) => {
    if (e.key === "Enter") go();
  });
  document.getElementById("reload").onclick = () => {
    try { frame && frame.reload && frame.reload(); } catch (e) { go(addr.value); }
  };
  document.getElementById("back").onclick = () => {
    try { history.back(); } catch (e) {}
  };
  document.getElementById("fwd").onclick = () => {
    try { history.forward(); } catch (e) {}
  };

  init();
})();
  </script>
</body>
</html>
