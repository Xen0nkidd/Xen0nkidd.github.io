<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> </title>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #120c1a); }
    #status {
      position: fixed; z-index: 9999; left: 12px; right: 12px; top: 12px;
      padding: 12px 14px; border-radius: 12px; font: 13px/1.45 system-ui, sans-serif;
      background: rgba(30, 20, 45, 0.92); color: #efe8f8; display: none;
      border: 1px solid rgba(192,132,252,.25);
    }
    #status.show { display: block; }
    #status.err { background: rgba(60, 16, 32, 0.95); color: #fecdd3; border-color: rgba(251,113,133,.35); }
    #f { position: fixed; inset: 0; background: transparent; }
  </style>
  <!-- Paths config inlined so engine works even if /js/education-proxy-paths.js 404s -->
  <script>
  (function (g) {
    g.velaraEduProxy = {
      runtimeBase: "/education/runtime/",
      messagingBase: "/education/messaging/",
      transportBase: "/education/transport/",
      epoxyBase: "/education/epoxy/",
      wispPath: "/education/channel/",
      lessonPrefix: "/education/lesson/",
    };
    g.velaraScramjetCodec = {
      encode: function (url) {
        if (!url) return url;
        var bytes = new TextEncoder().encode(url);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      },
      decode: function (enc) {
        if (!enc) return "";
        try {
          var s = String(enc).split("#")[0].replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) s += "=";
          var bin = atob(s);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var out = new TextDecoder().decode(bytes);
          if (out.indexOf("http://") === 0 || out.indexOf("https://") === 0) return out;
        } catch (e) {}
        return "";
      },
    };
  })(typeof globalThis !== "undefined" ? globalThis : window);
  </script>
</head>
<body>
  <div id="status" class="show">Starting proxy engine…</div>
  <div id="f"></div>

  <script>
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error("Failed to load " + src)); };
      document.head.appendChild(s);
    });
  }

  (async function () {
    try {
      var params = new URLSearchParams(location.search);
      var bg = params.get("bg");
      if (bg) document.documentElement.style.setProperty("--bg", bg);
    } catch (e) {}

    var status = document.getElementById("status");
    var parent = document.getElementById("f");
    function setStatus(msg, isErr) {
      status.textContent = msg;
      status.className = "show" + (isErr ? " err" : "");
    }
    function hideStatus() { status.className = ""; }

    function normalize(q) {
      q = String(q || "").trim();
      if (!q) return "";
      if (/^https?:\/\//i.test(q)) return q;
      if (/^[a-z0-9.-]+\.[a-z]{2,}([/:].*)?$/i.test(q)) return "https://" + q;
      return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
    }

    var frame = null;

    try {
      if (!globalThis.velaraEduProxy) throw new Error("paths config missing (inline failed)");

      setStatus("Loading Scramjet…");
      await loadScript("/js/all.js");
      if (typeof $scramjetLoadController !== "function") {
        // try runtime copy
        await loadScript("/education/runtime/all.js");
      }
      if (typeof $scramjetLoadController !== "function") {
        throw new Error("Scramjet not loaded — upload public/js/all.js to Railway");
      }

      setStatus("Loading BareMux…");
      await loadScript("/js/index.js");
      if (typeof BareMux === "undefined") {
        throw new Error("BareMux not loaded — upload public/js/index.js to Railway");
      }

      setStatus("Loading SW helper…");
      try {
        await loadScript("/js/register-sw.js");
      } catch (e) {
        console.warn(e);
      }

      setStatus("Registering service worker…");
      if (typeof waitForProxyServiceWorkerControl === "function") {
        var st = await waitForProxyServiceWorkerControl({
          reloadKey: "xenon-engine-sw-v4",
          maxWaitMs: 20000,
        });
        if (st === "reload") return;
      } else if (typeof registerSW === "function") {
        await registerSW();
        await navigator.serviceWorker.ready;
      } else if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" });
        await navigator.serviceWorker.ready;
      }

      setStatus("Init Scramjet controller…");
      var P = globalThis.velaraEduProxy;
      var ScramjetController = $scramjetLoadController().ScramjetController;
      var scramjet = new ScramjetController({
        prefix: P.lessonPrefix,
        files: {
          wasm: P.runtimeBase + "wasm.wasm",
          all: P.runtimeBase + "all.js",
          sync: P.runtimeBase + "sync.js",
        },
        codec: globalThis.velaraScramjetCodec,
      });
      await scramjet.init();

      setStatus("Connecting Wisp…");
      var connection = new BareMux.BareMuxConnection(P.messagingBase + "worker.js");
      var wispUrl =
        (location.protocol === "https:" ? "wss" : "ws") +
        "://" + location.host + P.wispPath;
      try {
        await connection.setTransport(P.transportBase + "index.mjs?v=20260512d", [
          { websocket: wispUrl },
        ]);
      } catch (err) {
        console.warn(err);
        setStatus("Wisp warning: " + err, true);
      }

      frame = scramjet.createFrame(parent);
      hideStatus();

      function go(raw) {
        var url = normalize(raw);
        if (!url || !frame) return;
        setStatus("Loading " + url + "…");
        try {
          frame.go(url);
          setTimeout(hideStatus, 1500);
        } catch (e) {
          setStatus("Navigate failed: " + e, true);
        }
      }

      window.xenonGo = go;
      window.addEventListener("message", function (ev) {
        var d = ev.data;
        if (!d) return;
        if (d.type === "xenon-navigate" && d.url) go(d.url);
        if (d.type === "xenon-theme" && d.bg) {
          document.documentElement.style.setProperty("--bg", d.bg);
          document.body.style.background = d.bg;
        }
      });

      var to = new URLSearchParams(location.search).get("to");
      if (to) go(to);
      else setStatus("Engine ready — waiting for URL");

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "xenon-engine-ready" }, "*");
        }
      } catch (e) {}
    } catch (e) {
      console.error(e);
      setStatus("Engine failed: " + (e && e.message ? e.message : e), true);
    }
  })();
  </script>
</body>
</html>
