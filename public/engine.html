<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> </title>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #120c1a); }
    #status {
      position: fixed; z-index: 9999; left: 12px; right: 12px; top: 12px;
      padding: 12px 14px; border-radius: 12px; font: 13px/1.45 system-ui, sans-serif;
      background: rgba(30, 20, 45, 0.92); color: #efe8f8; display: none;
      border: 1px solid rgba(192,132,252,.25);
    }
    #status.show { display: block; }
    #status.err { background: rgba(60, 16, 32, 0.95); color: #fecdd3; border-color: rgba(251,113,133,.35); }
    #f { position: fixed; inset: 0; background: transparent; }
    #f iframe { background: #fff; }
  </style>
</head>
<body>
  <div id="status" class="show">Starting proxy engine…</div>
  <div id="f"></div>
  <script src="/js/education-proxy-paths.js"></script>
  <script src="/js/all.js"></script>
  <script src="/js/index.js"></script>
  <script src="/js/register-sw.js"></script>
  <script>
(async function () {
  // Theme from parent query
  try {
    var params = new URLSearchParams(location.search);
    var bg = params.get("bg");
    if (bg) document.documentElement.style.setProperty("--bg", bg);
  } catch (e) {}

  const status = document.getElementById("status");
  const parent = document.getElementById("f");
  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className = "show" + (isErr ? " err" : "");
  }
  function hideStatus() { status.className = ""; }

  function normalize(q) {
    q = String(q || "").trim();
    if (!q) return "";
    if (/^https?:\/\//i.test(q)) return q;
    if (/^[a-z0-9.-]+\.[a-z]{2,}([/:].*)?$/i.test(q)) return "https://" + q;
    return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
  }

  let frame = null;
  let ready = false;

  try {
    if (!globalThis.velaraEduProxy) throw new Error("paths config missing");
    if (typeof $scramjetLoadController !== "function") throw new Error("Scramjet not loaded");
    if (typeof BareMux === "undefined") throw new Error("BareMux not loaded");

    setStatus("Registering service worker…");
    if (typeof waitForProxyServiceWorkerControl === "function") {
      const st = await waitForProxyServiceWorkerControl({
        reloadKey: "xenon-engine-sw-v3",
        maxWaitMs: 20000,
      });
      if (st === "reload") return;
    } else {
      await registerSW();
      await navigator.serviceWorker.ready;
    }

    setStatus("Init Scramjet…");
    const P = globalThis.velaraEduProxy;
    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      prefix: P.lessonPrefix,
      files: {
        wasm: P.runtimeBase + "wasm.wasm",
        all: P.runtimeBase + "all.js",
        sync: P.runtimeBase + "sync.js",
      },
      ...(globalThis.velaraScramjetCodec ? { codec: globalThis.velaraScramjetCodec } : {}),
    });
    await scramjet.init();

    setStatus("Connecting Wisp…");
    const connection = new BareMux.BareMuxConnection(P.messagingBase + "worker.js");
    const wispUrl = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + P.wispPath;
    try {
      await connection.setTransport(P.transportBase + "index.mjs?v=20260512d", [{ websocket: wispUrl }]);
    } catch (err) {
      console.warn(err);
      setStatus("Wisp transport warning: " + err, true);
    }

    frame = scramjet.createFrame(parent);
    ready = true;
    hideStatus();

    function go(raw) {
      const url = normalize(raw);
      if (!url) return;
      if (!frame) {
        setStatus("Engine not ready yet", true);
        return;
      }
      setStatus("Loading " + url + "…");
      try {
        frame.go(url);
        setTimeout(hideStatus, 1200);
      } catch (e) {
        setStatus("Navigate failed: " + e, true);
      }
    }

    window.xenonGo = go;
    window.addEventListener("message", (ev) => {
      const d = ev.data;
      if (!d) return;
      if (d.type === "xenon-navigate" && d.url) go(d.url);
      if (d.type === "xenon-theme" && d.bg) {
        document.documentElement.style.setProperty("--bg", d.bg);
        document.body.style.background = d.bg;
      }
    });

    const to = new URLSearchParams(location.search).get("to");
    if (to) go(to);

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "xenon-engine-ready" }, "*");
      }
    } catch (e) {}
  } catch (e) {
    console.error(e);
    setStatus("Engine failed: " + (e && e.message ? e.message : e), true);
  }
})();
  </script>
</body>
</html>
