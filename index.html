<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XenonNetwork</title>

<link rel="stylesheet" href="style.css">
<script src="mouse-lock.js"></script>
</head>

<body class="dark-mode">

<header>
<div class="header-content">
<div class="logo">XenonNetwork</div>

<div class="search-container">
<input type="text" id="searchBar" placeholder="Search zones..." oninput="filterZones()">

<select id="sortOptions" onchange="sortZones()">
<option value="name">Name</option>
<option value="id">ID (Date)</option>
<option value="popular">Popular</option>
</select>

<select id="quickLinks" onchange="handleQuickLink(this)">
<option value="">Quick Links</option>
<option value="https://xen0nkidd.github.io/jjk.html">JJK Episodes (Adless)</option>
<option value="https://xen0nkidd.github.io/ai.html">ChatGPT</option>
</select>
</div>
</div>
</header>

<main>
<h2>External Loader</h2>
<button onclick="launch()">Load Remote Page</button>
</main>

<div id="zoneViewer">
<iframe id="zoneFrame" style="width:100%; height:80vh; border:none;"></iframe>
</div>

<script>
function handleQuickLink(select) {
if (select.value) {
window.location.href = select.value;
select.value = "";
}
}
</script>

<!-- ✅ MERGED LOADER -->

<script>
function launch() {
const iframe = document.getElementById("zoneFrame");

try {
fetch("https://cdn.jsdelivr.net/gh/freebuisness/freebuisness.github.io@main/singlefile.html?t=" + Date.now())
.then(response => response.text())
.then(html => {
iframe.srcdoc = html;
});
} catch (error) {
console.error('error:', error);
}
}
</script>

</body>
</html>
