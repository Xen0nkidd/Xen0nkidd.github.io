
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arctic</title>
</head>
<body>
<script>
(() => {
    const requiredMarker = "arctic-root";
    const timestamp = Date.now();

    const urls = [
        "https://cdn.jsdelivr.net/gh/sealiee11/arctic@main/index.html",
        "https://testingcf.jsdelivr.net/gh/sealiee11/arctic@main/index.html",
        "https://gcore.jsdelivr.net/gh/sealiee11/arctic@main/index.html",
        "https://raw.githubusercontent.com/sealiee11/arctic/main/index.html",
        "https://cdn.statically.io/gh/sealiee11/arctic/main/index.html",
        "https://esm.sh/gh/sealiee11@main/arctic/index.html"
    ].map(url => url + "?d=" + timestamp);

    const iframe = document.createElement("iframe");

    iframe.allow = "fullscreen";
    iframe.style.cssText =
        "position:fixed;inset:0;width:100%;height:100%;border:0";

    document.body.appendChild(iframe);

    function loadNext() {
        const url = urls.shift();

        if (!url) {
            document.body.innerText = "Could not load Arctic.";
            return;
        }

        fetch(url, { cache: "no-store" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Request failed");
                }

                return response.text();
            })
            .then(html => {
                if (!html.includes(requiredMarker)) {
                    throw new Error("Required marker missing");
                }

                const baseUrl = new URL(".", url);

                iframe.srcdoc = html.replace(
                    /<head>/i,
                    '<head><base href="' + baseUrl.href + '">'
                );
            })
            .catch(() => {
                loadNext();
            });
    }

    loadNext();
})();
</script>
</body>
</html>
