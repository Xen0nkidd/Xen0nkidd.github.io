
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XenonNetwork</title>

    <link rel="icon" href="images/logo.png">
    <link href="css/home.css" rel="stylesheet" type="text/css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#180207">
    <meta name="msapplication-TileColor" content="#180207">
    <meta property="og:title" content="XenonNetwork">
    <meta property="og:image" content="images/logo.png">
    <meta name="description" content="XenonNetwork - dark crimson gaming network.">
    <meta property="og:description" content="XenonNetwork - dark crimson gaming network.">

    <style>
        :root {
            --crimson: #ff1744;
            --red: #d50032;
            --dark-red: #79001d;
            --deep-red: #33000d;
            --background: #090205;
            --text: #ffe8ed;
            --muted: #c78b99;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 0%,
                    rgba(125, 0, 30, 0.38) 0%,
                    transparent 55%),
                linear-gradient(145deg,
                    #090205 0%,
                    #180309 35%,
                    #100207 65%,
                    #050103 100%);
            color: var(--text);
            font-family: "Parkinsans", sans-serif;
        }

        a {
            color: #ff4266;
            text-decoration: none;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        a:hover {
            color: #ff8da3;
            text-shadow: 0 0 10px rgba(255, 23, 68, 0.85);
        }

        #header {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
            padding: 12px 24px;
            background: linear-gradient(90deg,
                rgba(12, 2, 5, 0.96),
                rgba(65, 0, 18, 0.91),
                rgba(12, 2, 5, 0.96));
            border-bottom: 1px solid rgba(255, 23, 68, 0.45);
            box-shadow:
                0 5px 25px rgba(160, 0, 35, 0.2),
                0 1px 12px rgba(255, 23, 68, 0.08);
            backdrop-filter: blur(14px);
        }

        .headericons {
            width: 35px;
            height: 35px;
            object-fit: contain;
            cursor: pointer;
            filter:
                brightness(0)
                saturate(100%)
                invert(25%)
                sepia(96%)
                saturate(6500%)
                hue-rotate(330deg)
                brightness(105%);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .headericons:hover {
            transform: translateY(-2px) scale(1.08);
            filter: drop-shadow(0 0 9px #ff1744);
        }

        #header img:first-child {
            width: 120px;
            height: auto;
            max-height: 55px;
            margin-left: 8px;
            object-fit: contain;
            transform: scale(1.15);
            transform-origin: left center;
        }

        #header .right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        #content {
            position: relative;
            z-index: 2;
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 65px 20px 75px;
            text-align: center;
        }

        #content h1 {
            margin: 0 auto 20px;
            font-size: clamp(1.8rem, 4.2vw, 3.1rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -1px;
            background: linear-gradient(110deg,
                #fff0f3 0%,
                #ff6684 25%,
                #ff1744 52%,
                #a9002b 75%,
                #ff9aad 100%);
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: crimsonGradient 7s ease infinite;
            filter: drop-shadow(0 0 17px rgba(255, 0, 55, 0.22));
        }

        #content h1 a {
            color: inherit;
            -webkit-text-fill-color: #ff4568;
            text-shadow: 0 0 18px rgba(255, 23, 68, 0.3);
        }

        #content h2 {
            margin: 0 auto 45px;
            color: #d5a1ac;
            font-size: clamp(0.9rem, 2vw, 1.15rem);
            font-weight: 400;
        }

        #content h3 {
            display: inline-block;
            margin: 5px 0 28px;
            padding: 11px 26px;
            color: #ffe3e9;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(110deg,
                rgba(102, 0, 27, 0.35),
                rgba(255, 23, 68, 0.12),
                rgba(102, 0, 27, 0.35));
            border: 1px solid rgba(255, 23, 68, 0.42);
            border-radius: 10px;
            box-shadow:
                0 0 20px rgba(180, 0, 42, 0.12),
                inset 0 0 15px rgba(255, 23, 68, 0.04);
        }

        #content > a {
            display: inline-block;
            width: 175px;
            margin: 10px;
            overflow: hidden;
            vertical-align: top;
            border: 1px solid rgba(255, 23, 68, 0.3);
            border-radius: 13px;
            background: linear-gradient(145deg,
                rgba(78, 0, 20, 0.75),
                rgba(17, 2, 7, 0.95));
            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.35),
                0 0 10px rgba(190, 0, 40, 0.08);
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        #content > a img {
            display: block;
            width: 100%;
            height: 120px;
            object-fit: cover;
            transition: transform 0.35s ease, filter 0.35s ease;
        }

        #content > a:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 55, 92, 0.9);
            box-shadow:
                0 8px 25px rgba(120, 0, 28, 0.35),
                0 0 22px rgba(255, 23, 68, 0.2);
        }

        #content > a:hover img {
            transform: scale(1.055);
            filter: brightness(1.08) saturate(1.12);
        }

        footer {
            margin-top: 45px;
            color: #a66c7b;
            font-size: 0.9rem;
        }

        #whereamifrom,
        #buildinfo {
            position: fixed;
            z-index: 3;
            bottom: 12px;
            color: rgba(255, 125, 151, 0.65);
            font-size: 11px;
            pointer-events: none;
        }

        #whereamifrom {
            left: 15px;
        }

        #buildinfo {
            right: 15px;
        }

        #whereamifrom p,
        #buildinfo p {
            margin: 0;
        }

        #vanta {
            position: fixed;
            z-index: 0;
            inset: 0;
            pointer-events: none;
            opacity: 0.52;
        }

        .rizzpopup {
            position: fixed;
            z-index: 20;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(5, 0, 2, 0.88);
            backdrop-filter: blur(12px);
        }

        #roddyrichesbox {
            width: min(500px, 95%);
            padding: 28px;
            color: #ffe8ed;
            text-align: center;
            background: linear-gradient(145deg,
                rgba(68, 0, 20, 0.98),
                rgba(14, 2, 6, 0.99));
            border: 1px solid rgba(255, 23, 68, 0.65);
            border-radius: 16px;
            box-shadow:
                0 0 35px rgba(255, 0, 55, 0.2),
                inset 0 0 25px rgba(255, 23, 68, 0.04);
        }

        @keyframes crimsonGradient {
            0%, 100% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
        }

        @media (max-width: 600px) {
            #header {
                padding: 12px 15px;
            }

            #content {
                padding: 45px 8px 65px;
            }

            #content > a {
                width: min(145px, 42%);
                margin: 6px;
            }

            #content > a img {
                height: 105px;
            }

            #content h2 {
                margin-bottom: 30px;
            }

            #whereamifrom,
            #buildinfo {
                font-size: 9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <script src="js/three.min.js"></script>

    <script>
        if (window.VANTA && window.VANTA.FOG) {
            VANTA.FOG({
