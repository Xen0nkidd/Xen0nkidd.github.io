<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine</title>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #120c1a); }
    #status {
      position: fixed; z-index: 9999; left: 12px; right: 12px; top: 12px;
      padding: 12px 14px; border-radius: 12px; font: 13px/1.45 system-ui, sans-serif;
      background: rgba(30, 20, 45, 0.95); color: #efe8f8;
      border: 1px solid rgba(192,132,252,.3); display: none; white-space: pre-wrap;
    }
    #status.show { display: block; }
    #status.err { background: rgba(60, 16, 32, 0.96); color: #fecdd3; }
    #f { position: fixed; inset: 0; }
    #f iframe { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; border: 0 !important; background: #fff; }
  </style>
  <script>
  (function (g) {
    g.velaraEduProxy = {
      runtimeBase: "/education/runtime/",
      messagingBase: "/education/messaging/",
      transportBase: "/education/transport/",
      epoxyBase: "/education/epoxy/",
      wispPath: "/education/channel/",
      lessonPrefix: "/education/lesson/",
    };
    g.velaraScramjetCodec = {
      encode: function (url) {
        if (!url) return url;
        var bytes = new TextEncoder().encode(url);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      },
      decode: function (enc) {
        if (!enc) return "";
        try {
          var s = String(enc).split("#")[0].replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) s += "=";
          var bin = atob(s);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var out = new TextDecoder().decode(bytes);
          if (out.indexOf("http") === 0) return out;
        } catch (e) {}
        return "";
      },
    };
  })(typeof globalThis !== "undefined" ? globalThis : window);
  </script>
</head>
<body>
  <div id="status" class="show">Starting…</div>
  <div id="f"></div>
  <script>
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error("Failed to load " + src + " (404?)")); };
      document.head.appendChild(s);
    });
  }

  (async function () {
    try {
      var bg = new URLSearchParams(location.search).get("bg");
      if (bg) document.documentElement.style.setProperty("--bg", bg);
    } catch (e) {}

    var status = document.getElementById("status");
    var parent = document.getElementById("f");
    function setStatus(msg, isErr) {
      status.textContent = msg;
      status.className = "show" + (isErr ? " err" : "");
    }
    function hideStatus() { status.className = ""; }

    function normalize(q) {
      q = String(q || "").trim();
      if (!q) return "";
      if (/^https?:\/\//i.test(q)) return q;
      if (/^[a-z0-9.-]+\.[a-z]{2,}([/:].*)?$/i.test(q)) return "https://" + q;
      return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
    }

    var scramjet = null;
    var frame = null;
    var connection = null;
    var P = globalThis.velaraEduProxy;

    try {
      setStatus("Loading libraries…");
      await loadScript("/js/all.js");
      if (typeof $scramjetLoadController !== "function") {
        await loadScript("/education/runtime/all.js");
      }
      if (typeof $scramjetLoadController !== "function") {
        throw new Error("Scramjet missing — public/js/all.js not on Railway");
      }
      await loadScript("/js/index.js");
      if (typeof BareMux === "undefined") {
        throw new Error("BareMux missing — public/js/index.js not on Railway");
      }
      try { await loadScript("/js/register-sw.js"); } catch (e) { console.warn(e); }

      // Register SW and WAIT until it actually controls this page
      setStatus("Registering service worker…");
      if (!("serviceWorker" in navigator)) throw new Error("No service worker support");

      var reg = await navigator.serviceWorker.register("/sw.js?v=engine5", {
        scope: "/",
        updateViaCache: "none",
      });
      try { await reg.update(); } catch (e) {}
      await navigator.serviceWorker.ready;

      if (!navigator.serviceWorker.controller) {
        setStatus("Waiting for service worker to control page…");
        await new Promise(function (resolve) {
          var t = setTimeout(resolve, 8000);
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            clearTimeout(t);
            resolve();
          }, { once: true });
        });
      }

      if (!navigator.serviceWorker.controller) {
        // One controlled reload so SW takes over (only once)
        try {
          if (!sessionStorage.getItem("xenon-sw-reload")) {
            sessionStorage.setItem("xenon-sw-reload", "1");
            setStatus("Reloading once so SW can control…");
            location.reload();
            return;
          }
        } catch (e) {}
        setStatus("WARNING: SW not controlling. Proxy may fail.\nContinue anyway…", true);
      } else {
        try { sessionStorage.removeItem("xenon-sw-reload"); } catch (e) {}
      }

      setStatus("Init Scramjet…");
      var ScramjetController = $scramjetLoadController().ScramjetController;
      scramjet = new ScramjetController({
        prefix: P.lessonPrefix,
        files: {
          wasm: P.runtimeBase + "wasm.wasm",
          all: P.runtimeBase + "all.js",
          sync: P.runtimeBase + "sync.js",
        },
        codec: globalThis.velaraScramjetCodec,
      });
      await scramjet.init();

      setStatus("Connecting Wisp transport…");
      connection = new BareMux.BareMuxConnection(P.messagingBase + "worker.js");
      var wispUrl =
        (location.protocol === "https:" ? "wss" : "ws") +
        "://" + location.host + P.wispPath;
      try {
        await connection.setTransport(P.transportBase + "index.mjs?v=20260512d", [
          { websocket: wispUrl },
        ]);
        setStatus("Wisp connected: " + wispUrl);
      } catch (err) {
        setStatus("Wisp transport failed: " + err + "\nURL: " + wispUrl, true);
        console.error(err);
      }

      frame = scramjet.createFrame(parent);
      // Force full size on any iframe Scramjet inserts
      setTimeout(function () {
        var iframes = parent.querySelectorAll("iframe");
        iframes.forEach(function (ifr) {
          ifr.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;";
        });
      }, 50);

      function go(raw) {
        var url = normalize(raw);
        if (!url) return;
        var enc = globalThis.velaraScramjetCodec.encode(url);
        var lessonPath = P.lessonPrefix + enc + "/";
        setStatus("Loading " + url + "\nvia " + lessonPath + "\nSW: " + (navigator.serviceWorker.controller ? "yes" : "NO"));

        try {
          if (frame && typeof frame.go === "function") {
            frame.go(url);
          } else {
            // Fallback: direct lesson URL in a plain iframe
            parent.innerHTML = "";
            var ifr = document.createElement("iframe");
            ifr.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;";
            ifr.src = lessonPath;
            parent.appendChild(ifr);
          }
        } catch (e) {
          setStatus("go() error: " + e, true);
          return;
        }

        // Keep status up; hide only if iframe gets content
        setTimeout(function () {
          var ifr = parent.querySelector("iframe");
          if (ifr) {
            try {
              // cross-origin after proxy — can't read; assume still loading
              setStatus("Still loading (if this stays forever, Wisp/SW fetch failed)\n" + url);
            } catch (e) {}
          }
        }, 4000);
      }

      window.xenonGo = go;
      window.addEventListener("message", function (ev) {
        var d = ev.data;
        if (d && d.type === "xenon-navigate" && d.url) go(d.url);
        if (d && d.type === "xenon-theme" && d.bg) {
          document.documentElement.style.setProperty("--bg", d.bg);
        }
      });

      var to = new URLSearchParams(location.search).get("to");
      if (to) {
        go(to);
      } else {
        setStatus("Engine ready — waiting for URL\nSW: " + (navigator.serviceWorker.controller ? "yes" : "NO") + "\nTry ?to=https://example.com");
      }

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "xenon-engine-ready" }, "*");
        }
      } catch (e) {}
    } catch (e) {
      console.error(e);
      setStatus("Engine failed: " + (e && e.message ? e.message : e), true);
    }
  })();
  </script>
</body>
</html>
